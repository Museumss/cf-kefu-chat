name = "cf_kefu1"
main = "src/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

# 变量（非机密）
[vars]
SHOP_NAME = "在线客服"
MAX_IMAGE_MB = "5"
RECALL_WINDOW_SEC = "120"
AGENT_NAME = "客服小旗"

[observability]
enabled = true

# D1 数据库：先执行 wrangler d1 create cf_kefu 拿到 database_id 填到这里
[[d1_databases]]
binding = "DB"
database_name = "cf_kefu1"
database_id = "71b19b11-c181-485f-9d68-ff6b31b2950f"
migrations_dir = "migrations"

# R2 对象存储：先执行 wrangler r2 bucket create kefu1-chat
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kefu1-chat"

# 静态资源（public 目录）：Worker 优先接管请求，再回落到静态资源
[assets]
directory = "./public"
binding = "ASSETS"

